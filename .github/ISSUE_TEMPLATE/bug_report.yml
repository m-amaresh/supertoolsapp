name: Bug report
description: Report a reproducible issue
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the issue and its impact.
      placeholder: A clear summary of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest set of steps that reproduces the issue.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should happen instead?

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happens now?

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, OS, device, route, deployment, or version.

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: Add screenshots, console errors, or logs if they help explain the issue.
