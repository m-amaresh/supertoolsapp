name: CI

on:
  pull_request:
    branches:
      - preview
      - main
  push:
    branches:
      - preview
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SITE_URL: https://www.supertoolsapp.com
      # A placeholder property that receives nothing. It exists so the build
      # under test actually contains the consent banner and the Consent Mode
      # bootstrap — without an ID those code paths compile away, and
      # tests/e2e/consent.test.ts would silently assert nothing. The test
      # blocks googletagmanager.com, so no request reaches Google from CI.
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-TEST1234567

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm -s exec biome check src/app src/components src/hooks src/lib tests next.config.ts vitest.config.e2e.mts scripts public/pdf/qpdf-worker.js public/pdf/qpdf-merge-worker.js public/pdf/qpdf-encrypt-worker.js

      - name: Unit tests
        run: pnpm -s test:run

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-results
          path: test-results/vitest.xml
          if-no-files-found: ignore

      - name: Type check
        run: pnpm typecheck

      - name: Production build
        run: pnpm -s build

      - name: Install Chromium for layout tests
        # Preview is the E2E gate; promoting it to main does not rerun browsers.
        if: github.ref == 'refs/heads/preview' || github.base_ref == 'preview'
        run: pnpm -s exec playwright-core install --with-deps chromium

      - name: Layout and behaviour tests
        if: github.ref == 'refs/heads/preview' || github.base_ref == 'preview'
        run: pnpm -s test:e2e

      - name: Upload layout test results artifact
        if: always() && (github.ref == 'refs/heads/preview' || github.base_ref == 'preview')
        uses: actions/upload-artifact@v7
        with:
          name: vitest-e2e-results
          path: test-results/vitest-e2e.xml
          if-no-files-found: ignore
